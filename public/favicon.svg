<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Kairo Ride icon</title>
  <desc id="desc">Black app icon with an orange tire, white speedometer and perspective road.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="43%" r="72%">
      <stop offset="0" stop-color="#171b1e"/><stop offset="0.62" stop-color="#0b0d0f"/><stop offset="1" stop-color="#050607"/>
    </radialGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7900"/><stop offset="1" stop-color="#f45100"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/></filter>
    <path id="tread-groove" d="M 476 92 L 518 84 L 554 145 L 522 184 L 514 200 L 510 181 L 526 143 Z" fill="#090b0d"/>
  </defs>
  <rect width="1024" height="1024" fill="url(#background)"/>
  <g id="icon" filter="url(#soft-shadow)">
    <circle id="tire" cx="512" cy="500" r="352" fill="none" stroke="url(#orange)" stroke-width="104"/>
    <g id="directional-tread">
      <use xlink:href="#tread-groove" transform="rotate(0 512 500)"/><use xlink:href="#tread-groove" transform="rotate(20 512 500)"/>
      <use xlink:href="#tread-groove" transform="rotate(40 512 500)"/><use xlink:href="#tread-groove" transform="rotate(60 512 500)"/>
      <use xlink:href="#tread-groove" transform="rotate(80 512 500)"/><use xlink:href="#tread-groove" transform="rotate(100 512 500)"/>
      <use xlink:href="#tread-groove" transform="rotate(120 512 500)"/><use xlink:href="#tread-groove" transform="rotate(140 512 500)"/>
      <use xlink:href="#tread-groove" transform="rotate(160 512 500)"/><use xlink:href="#tread-groove" transform="rotate(180 512 500)"/>
      <use xlink:href="#tread-groove" transform="rotate(200 512 500)"/><use xlink:href="#tread-groove" transform="rotate(220 512 500)"/>
      <use xlink:href="#tread-groove" transform="rotate(240 512 500)"/><use xlink:href="#tread-groove" transform="rotate(260 512 500)"/>
      <use xlink:href="#tread-groove" transform="rotate(280 512 500)"/><use xlink:href="#tread-groove" transform="rotate(300 512 500)"/>
      <use xlink:href="#tread-groove" transform="rotate(320 512 500)"/><use xlink:href="#tread-groove" transform="rotate(340 512 500)"/>
    </g>
    <circle cx="512" cy="500" r="294" fill="none" stroke="#090b0d" stroke-width="13" opacity="0.92"/>
    <path id="speedometer-arc" d="M 352 666 A 232 232 0 1 1 672 666" fill="none" stroke="#f5f2ec" stroke-width="35" stroke-linecap="butt"/>
    <g id="road">
      <path d="M 405 734 L 480 566 L 496 576 L 438 758 Z" fill="#f5f2ec"/><path d="M 619 734 L 544 566 L 528 576 L 586 758 Z" fill="#f5f2ec"/>
      <path d="M 503 736 L 521 736 L 519 689 L 505 689 Z" fill="#f5f2ec"/><path d="M 506 661 L 518 661 L 517 626 L 507 626 Z" fill="#f5f2ec"/><path d="M 509 606 L 515 606 L 515 584 L 509 584 Z" fill="#f5f2ec"/>
    </g>
    <g id="speedometer-needle"><path d="M 492 514 L 728 306 L 532 538 Z" fill="url(#orange)"/><circle cx="512" cy="520" r="42" fill="url(#orange)"/><circle cx="512" cy="520" r="19" fill="#111417"/></g>
  </g>
</svg>
